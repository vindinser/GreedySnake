<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GreedySnake</title>
</head>
<body>
<!-- 游戏机外壳 -->
<div class="console">
  <!-- 顶部装饰 -->
  <div class="console-top">
    <div class="speaker-grille">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="brand">ZhangShuang</div>
    <!-- 电源按钮 -->
    <button class="power-btn" id="powerBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="2" x2="12" y2="12"/>
        <path d="M18.36 6.64A9 9 0 1 1 5.64 6.64"/>
      </svg>
    </button>
  </div>

  <!-- 屏幕区域 -->
  <div class="screen-bezel">
    <div class="screen-label">GREEN GAME</div>
    <!-- 记分牌 -->
    <div class="score-panel">
      <div>
        SCORE:<span id="score">0</span>
      </div>
      <div>
        LEVEL:<span id="level">1</span>
      </div>
    </div>
    <!-- 游戏窗口 -->
    <div class="stage">
      <!-- 蛇 -->
      <div class="snake">
        <div></div>
      </div>
      <!-- 食物 -->
      <div class="food">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>

      <!-- 待机页面（关机状态） -->
      <div class="standby-overlay show" id="standbyOverlay">
        <div class="standby-logo">ZhangShuang</div>
        <div class="standby-hint">PRESS POWER TO START</div>
        <div class="standby-clock" id="standbyClock"></div>
      </div>

      <!-- 就绪页面（开机未开始游戏） -->
      <div class="ready-overlay" id="readyOverlay">
        <div class="ready-title">GREEDY<br>SNAKE</div>
        <div class="ready-hint">PRESS START<br>OR ANY KEY</div>
      </div>

      <!-- 游戏结束覆盖层 -->
      <div class="game-over" id="gameOver">
        <div class="game-over-text">GAME<br>OVER</div>
        <div class="game-over-score">SCORE: <span id="finalScore">0</span></div>
        <button class="restart-btn" id="restartBtn">RESTART</button>
      </div>

      <!-- 暂停覆盖层 -->
      <div class="pause-overlay" id="pauseOverlay">
        <div class="pause-icon">❚❚</div>
        <div class="pause-text">PAUSED</div>
        <div class="pause-hint">PRESS START TO CONTINUE</div>
      </div>
    </div>
  </div>

  <!-- 控制区域 -->
  <div class="controls">
    <!-- 左侧：十字方向键 -->
    <div class="dpad">
      <button class="dpad-btn dpad-up" data-dir="ArrowUp">▲</button>
      <button class="dpad-btn dpad-left" data-dir="ArrowLeft">◀</button>
      <button class="dpad-center"></button>
      <button class="dpad-btn dpad-right" data-dir="ArrowRight">▶</button>
      <button class="dpad-btn dpad-down" data-dir="ArrowDown">▼</button>
    </div>

    <!-- 中间：START 按钮 -->
    <div class="center-buttons">
      <button class="start-btn" id="startBtn">START</button>
      <button class="select-btn" id="selectBtn">SELECT</button>
    </div>

    <!-- 右侧：功能按钮 -->
    <div class="action-buttons">
      <button class="action-btn btn-b" data-action="slow">B</button>
      <button class="action-btn btn-a" data-action="fast">A</button>
      <div class="action-label">
        <span>SLOW</span>
        <span>FAST</span>
      </div>
    </div>
  </div>

  <!-- 底部装饰 -->
  <div class="console-bottom">
    <div class="led-light" id="ledLight"></div>
    <div class="console-text">GREEDY SNAKE CONSOLE</div>
  </div>
</div>
</body>
</html>
