<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ZhangShuang · 游戏合集</title>
</head>
<body>
  <!-- 主页：游戏选择 -->
  <div class="home show" id="homeView">
    <div class="home-top">
      <div class="speaker-grille">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="brand">ZhangShuang</div>
      <div class="led-light on"></div>
    </div>

    <div class="home-title">GAME LIBRARY</div>
    <div class="home-subtitle">选择一款游戏开始</div>

    <!-- 游戏列表（由 App 依据游戏注册表渲染） -->
    <div class="game-list" id="gameList"></div>

    <div class="home-bottom">更多游戏即将推出</div>
  </div>

  <!-- 游戏视图：内容由各游戏模块自行渲染 -->
  <div class="app-game" id="gameView">
    <div class="game-bar">
      <button class="back-btn" id="backBtn">◀ MENU</button>
      <span class="game-bar-title" id="gameTitle"></span>
      <span class="game-bar-led"></span>
    </div>
    <div class="game-content" id="gameContent"></div>
  </div>
</body>
</html>
